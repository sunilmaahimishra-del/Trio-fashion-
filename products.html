<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products - Trio Fashion</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .products-container {
      padding: 25px 15px;
      max-width: 1200px;
      margin: auto;
    }

    .products-title {
      text-align: center;
      margin-bottom: 25px;
    }

    #productGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      padding-bottom: 15px;
    }

    .product-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 12px;
      text-align: center;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin: 5px 0;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0 12px;
    }

    .add-cart-btn {
      width: 100%;
      border: none;
      padding: 11px;
      border-radius: 7px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .add-cart-btn:hover {
      opacity: 0.85;
    }

    .cart-link {
      display: inline-block;
      margin: 15px auto;
      padding: 10px 18px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
  </style>
</head>

<body>

<header>
  <h1>Trio Fashion</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">
      Cart (<span id="cartCount">0</span>)
    </a>
  </nav>
</header>

<main class="products-container">

  <h2 class="products-title">Our Products</h2>

  <div style="text-align:center;">
    <a href="cart.html" class="cart-link">
      🛒 View Cart
    </a>
  </div>

  <div id="productGrid"></div>

</main>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
