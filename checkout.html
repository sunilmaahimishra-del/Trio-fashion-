<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - Trio Fashion</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><h1>Trio Fashion</h1></header>
<main><h2>Checkout</h2><form id="checkoutForm" class="form">
<input id="name" required placeholder="Full Name"><input id="phone" required placeholder="Mobile Number" inputmode="numeric">
<textarea id="address" required placeholder="Full Address"></textarea><input id="pincode" required placeholder="Pincode" inputmode="numeric">
<button class="btn" type="submit">Continue to Payment</button></form>
<p id="msg"></p></main>
<script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/checkout.js"></script></body></html>
